<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA : rend l'app installable sur Windows (Edge/Chrome → « Installer EduStudy Hub »). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFD3B0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduStudy Hub</title>
    <script>
      // Applique le thème avant le premier paint (évite le flash clair→sombre) — voir
      // src/utils/useTheme.js pour la logique React associée (bascule + persistance).
      try {
        var theme = localStorage.getItem('edustudy-hub-theme')
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
